<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Work at Height — Vertigo & Acrophobia Assessment Simulator</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.86);
      --border-glass: rgba(148, 163, 184, 0.25);
      --accent: #38bdf8;
      --warn: #f59e0b;
      --danger: #ef4444;
      --ok: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: var(--text);
    }

    a-scene {
      position: fixed !important;
      top: 0;
      left: 0;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1;
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      width: 360px;
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      border-radius: 8px;
      padding: 14px;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: var(--ok);
      border: 1px solid var(--ok);
    }

    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .metric-box {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 6px;
      padding: 8px;
    }

    .metric-label {
      font-size: 10px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 2px;
    }

    .metric-val {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    #sway-canvas {
      width: 100%;
      height: 44px;
      background: rgba(2, 6, 23, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 4px;
      margin-bottom: 10px;
      display: block;
    }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .btn {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--border-glass);
      color: var(--text);
      padding: 7px 4px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.2);
    }

    .btn.active {
      background: var(--accent);
      color: #020617;
      border-color: var(--accent);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }

    .btn-warn {
      border-color: var(--warn);
      color: var(--warn);
    }

    .btn-danger {
      border-color: var(--danger);
      color: var(--danger);
    }

    .instructions {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px solid var(--border-glass);
      padding-top: 8px;
      margin-top: 6px;
    }
  </style>

  <script>
    // =========================================================
    // 1. PROCEDURAL TEXTURES & MATERIALS (REGISTERED IN HEAD)
    // =========================================================
    const TextureFactory = {
      cache: {},

      getGrating() {
        if (this.cache.grating) return this.cache.grating;
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 256, 256);

        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 10;
        for (let i = 0; i <= 256; i += 32) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(256, i); ctx.stroke();
        }
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3;
        for (let i = 0; i <= 256; i += 32) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 256); ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        this.cache.grating = tex;
        return tex;
      },

      getHazard() {
        if (this.cache.hazard) return this.cache.hazard;
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#eab308';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#0f172a';
        for (let i = -256; i < 512; i += 64) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + 32, 0);
          ctx.lineTo(i - 224, 256);
          ctx.lineTo(i - 256, 256);
          ctx.closePath();
          ctx.fill();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        this.cache.hazard = tex;
        return tex;
      },

      getGround() {
        if (this.cache.ground) return this.cache.ground;
        const c = document.createElement('canvas');
        c.width = 512;
        c.height = 512;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#334155';
        ctx.fillRect(0, 0, 512, 512);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 3;
        for (let i = 0; i <= 512; i += 64) {
          ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        this.cache.ground = tex;
        return tex;
      },

      getPlank() {
        if (this.cache.plank) return this.cache.plank;
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#78350f';
        ctx.fillRect(0, 0, 256, 256);
        ctx.fillStyle = '#92400e';
        for (let i = 0; i < 256; i += 16) {
          ctx.fillRect(i, 0, 8, 256);
        }
        ctx.fillStyle = '#facc15';
        ctx.fillRect(0, 0, 14, 256);
        ctx.fillRect(242, 0, 14, 256);
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        this.cache.plank = tex;
        return tex;
      },

      getFallbackSky() {
        if (this.cache.sky) return this.cache.sky;
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 512;
        const ctx = c.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0.0, '#0f172a');
        grad.addColorStop(0.45, '#38bdf8');
        grad.addColorStop(0.50, '#e2e8f0');
        grad.addColorStop(0.55, '#475569');
        grad.addColorStop(1.0, '#1e293b');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        const tex = new THREE.CanvasTexture(c);
        this.cache.sky = tex;
        return tex;
      }
    };

    AFRAME.registerComponent('procedural-material', {
      schema: {
        type: { type: 'string', default: 'grating' },
        repeatX: { type: 'number', default: 4 },
        repeatY: { type: 'number', default: 4 }
      },
      init: function () {
        this.applyTexture = this.applyTexture.bind(this);
        this.el.addEventListener('loaded', this.applyTexture);
        if (this.el.getObject3D('mesh')) this.applyTexture();
      },
      applyTexture: function () {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) return;
        let baseTex = null;
        if (this.data.type === 'grating') baseTex = TextureFactory.getGrating();
        else if (this.data.type === 'hazard') baseTex = TextureFactory.getHazard();
        else if (this.data.type === 'ground') baseTex = TextureFactory.getGround();
        else if (this.data.type === 'plank') baseTex = TextureFactory.getPlank();
        if (!baseTex) return;

        const tex = baseTex.clone();
        tex.needsUpdate = true;
        tex.repeat.set(this.data.repeatX, this.data.repeatY);

        mesh.traverse((node) => {
          if (node.isMesh) {
            node.material = new THREE.MeshStandardMaterial({
              map: tex,
              transparent: this.data.type === 'grating',
              alphaTest: this.data.type === 'grating' ? 0.25 : 0,
              side: THREE.DoubleSide,
              roughness: 0.65,
              metalness: this.data.type === 'grating' ? 0.6 : 0.2
            });
          }
        });
      }
    });

    // =========================================================
    // 2. INDUSTRIAL TOWER & ENVIRONMENT BUILDER
    // =========================================================
    AFRAME.registerComponent('industrial-tower-builder', {
      init: function () {
        const root = this.el;
        const height = 65;
        const tierStep = 5;

        // 4 Main Corner Columns (centered at Z = -2.1, Platform travels cleanly on south face Z = 0)
        const cols = [
          [-1.6, -0.7],
          [ 1.6, -0.7],
          [-1.6, -3.5],
          [ 1.6, -3.5]
        ];

        cols.forEach(([x, z]) => {
          const col = document.createElement('a-box');
          col.setAttribute('position', `${x} ${height / 2} ${z}`);
          col.setAttribute('width', '0.24');
          col.setAttribute('height', height);
          col.setAttribute('depth', '0.24');
          col.setAttribute('color', '#334155');
          root.appendChild(col);
        });

        // Horizontal Girders & Height Marker Placards every 5m
        for (let y = 5; y <= height; y += tierStep) {
          const frontBeam = document.createElement('a-box');
          frontBeam.setAttribute('position', `0 ${y} -0.7`);
          frontBeam.setAttribute('width', '3.4');
          frontBeam.setAttribute('height', '0.16');
          frontBeam.setAttribute('depth', '0.16');
          frontBeam.setAttribute('color', y % 15 === 0 ? '#f59e0b' : '#475569');
          root.appendChild(frontBeam);

          const backBeam = document.createElement('a-box');
          backBeam.setAttribute('position', `0 ${y} -3.5`);
          backBeam.setAttribute('width', '3.4');
          backBeam.setAttribute('height', '0.16');
          backBeam.setAttribute('depth', '0.16');
          backBeam.setAttribute('color', '#475569');
          root.appendChild(backBeam);

          [-1.6, 1.6].forEach((x) => {
            const sideBeam = document.createElement('a-box');
            sideBeam.setAttribute('position', `${x} ${y} -2.1`);
            sideBeam.setAttribute('width', '0.14');
            sideBeam.setAttribute('height', '0.14');
            sideBeam.setAttribute('depth', '2.8');
            sideBeam.setAttribute('color', '#475569');
            root.appendChild(sideBeam);
          });

          // Elevation sign
          const sign = document.createElement('a-plane');
          sign.setAttribute('position', `-2.15 ${y} -0.7`);
          sign.setAttribute('width', '0.8');
          sign.setAttribute('height', '0.4');
          sign.setAttribute('color', '#0f172a');
          const txt = document.createElement('a-text');
          txt.setAttribute('value', `${y}m`);
          txt.setAttribute('align', 'center');
          txt.setAttribute('color', '#38bdf8');
          txt.setAttribute('width', '4');
          txt.setAttribute('position', '0 0 0.02');
          sign.appendChild(txt);
          root.appendChild(sign);
        }

        // Ground Drop Zone Bullseye directly beneath the 60m Plank
        const rings = [
          { r: 4.5, c: '#ef4444', y: 0.02 },
          { r: 3.0, c: '#f8fafc', y: 0.03 },
          { r: 1.5, c: '#ef4444', y: 0.04 }
        ];
        rings.forEach((ring) => {
          const cyl = document.createElement('a-cylinder');
          cyl.setAttribute('position', `0 ${ring.y} 3.2`);
          cyl.setAttribute('radius', ring.r);
          cyl.setAttribute('height', '0.02');
          cyl.setAttribute('color', ring.c);
          root.appendChild(cyl);
        });
      }
    });

    // =========================================================
    // 3. GAZE VERIFICATION SPHERES & VR BUTTONS
    // =========================================================
    AFRAME.registerComponent('gaze-target', {
      schema: {
        id: { type: 'string', default: 'T1' }
      },
      init: function () {
        this.hovering = false;
        this.dwell = 0;
        this.verified = false;

        this.ring = document.createElement('a-ring');
        this.ring.setAttribute('radius-inner', '0.38');
        this.ring.setAttribute('radius-outer', '0.46');
        this.ring.setAttribute('color', '#38bdf8');
        this.ring.setAttribute('material', 'shader: flat; side: double');
        this.ring.setAttribute('visible', 'false');
        this.el.appendChild(this.ring);

        this.el.addEventListener('mouseenter', () => {
          if (this.verified) return;
          this.hovering = true;
          this.ring.setAttribute('visible', 'true');
        });

        this.el.addEventListener('mouseleave', () => {
          this.hovering = false;
          if (!this.verified) {
            this.dwell = 0;
            this.ring.setAttribute('visible', 'false');
            this.el.setAttribute('scale', '1 1 1');
          }
        });

        this.el.addEventListener('click', () => {
          if (!this.verified) this.completeTarget();
        });
      },
      tick: function (t, dt) {
        if (!this.hovering || this.verified) return;
        this.dwell += dt / 1000;
        const s = 1 + Math.sin(t * 0.015) * 0.1;
        this.el.setAttribute('scale', `${s} ${s} ${s}`);
        if (this.dwell >= 1.5) {
          this.completeTarget();
        }
      },
      completeTarget: function () {
        this.verified = true;
        this.hovering = false;
        this.el.setAttribute('color', '#22c55e');
        this.el.setAttribute('scale', '1.15 1.15 1.15');
        this.ring.setAttribute('color', '#22c55e');
        this.ring.setAttribute('visible', 'true');
        const sys = document.querySelector('a-scene').components['elevator-telemetry-system'];
        if (sys) sys.onTargetVerified(this.data.id);
      },
      resetTarget: function () {
        this.verified = false;
        this.hovering = false;
        this.dwell = 0;
        this.el.setAttribute('color', '#f97316');
        this.el.setAttribute('scale', '1 1 1');
        this.ring.setAttribute('color', '#38bdf8');
        this.ring.setAttribute('visible', 'false');
      }
    });

    AFRAME.registerComponent('vr-ui-btn', {
      schema: {
        action: { type: 'string' },
        param: { type: 'string', default: '' }
      },
      init: function () {
        const baseColor = this.el.getAttribute('color') || '#1e293b';
        this.el.addEventListener('mouseenter', () => {
          this.el.setAttribute('color', '#0284c7');
        });
        this.el.addEventListener('mouseleave', () => {
          this.el.setAttribute('color', baseColor);
        });
        this.el.addEventListener('click', () => {
          const sys = document.querySelector('a-scene').components['elevator-telemetry-system'];
          if (sys) sys.handleAction(this.data.action, this.data.param);
        });
      }
    });

    // =========================================================
    // 4. CORE ELEVATOR, AUDIO & 60HZ SWAY TELEMETRY SYSTEM
    // =========================================================
    AFRAME.registerComponent('elevator-telemetry-system', {
      init: function () {
        this.stages = [0, 5, 15, 30, 60];
        this.currentStageIndex = 0;
        this.currentY = 0;
        this.targetY = 0;
        this.speed = 4.2; // meters/sec
        this.plankExtended = false;
        this.verifiedSet = new Set();

        this.lastCamPos = new THREE.Vector3();
        this.hasLastCam = false;
        this.currentSway = 0;
        this.peakSway = 0;
        this.swayHistory = new Array(60).fill(0);
        this.sessionLog = [];
        this.sampleAccum = 0;

        this.rig = document.getElementById('elevator-rig');
        this.cam = document.getElementById('head-camera');
        this.plank = document.getElementById('cantilever-plank');
        this.frontGate = document.getElementById('front-safety-gate');
        this.vrReadout = document.getElementById('vr-console-readout');
        this.swayCanvas = document.getElementById('sway-canvas');
        this.swayCtx = this.swayCanvas ? this.swayCanvas.getContext('2d') : null;

        // Web Audio Synthesizer
        this.audioCtx = null;
        this.windGain = null;
      },

      ensureAudio: function () {
        if (this.audioCtx) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.audioCtx = new AudioContext();
          const bufferSize = this.audioCtx.sampleRate * 2;
          const noiseBuffer = this.audioCtx.createBuffer(1, bufferSize, this.audioCtx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = this.audioCtx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;
          whiteNoise.loop = true;

          const filter = this.audioCtx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.value = 320;

          this.windGain = this.audioCtx.createGain();
          this.windGain.gain.value = 0.01;

          whiteNoise.connect(filter);
          filter.connect(this.windGain);
          this.windGain.connect(this.audioCtx.destination);
          whiteNoise.start(0);
        } catch (e) {
          // Audio blocked until user gesture
        }
      },

      playTone: function (freq, duration = 0.12) {
        this.ensureAudio();
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const g = this.audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        g.gain.value = 0.08;
        osc.connect(g);
        g.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
      },

      handleAction: function (action, param) {
        if (action === 'stage') {
          const idx = parseInt(param, 10);
          if (!isNaN(idx) && idx >= 0 && idx < this.stages.length) {
            this.currentStageIndex = idx;
            this.targetY = this.stages[idx];
            this.playTone(440 + idx * 90, 0.12);
            if (this.targetY >= 60 && !this.plankExtended) {
              this.setPlank(true);
            } else if (this.targetY < 60 && this.plankExtended) {
              this.setPlank(false);
            }
          }
        } else if (action === 'toggle-plank') {
          this.setPlank(!this.plankExtended);
        } else if (action === 'abort') {
          this.currentStageIndex = 0;
          this.targetY = 0;
          this.setPlank(false);
          this.playTone(220, 0.35);
        } else if (action === 'reset') {
          this.peakSway = 0;
          this.verifiedSet.clear();
          this.sessionLog = [];
          document.querySelectorAll('[gaze-target]').forEach((el) => {
            el.components['gaze-target'].resetTarget();
          });
          this.playTone(520, 0.15);
        }
        this.syncButtons();
      },

      setPlank: function (extend) {
        this.plankExtended = extend;
        if (this.plank) {
          this.plank.setAttribute('position', extend ? '0 0.02 2.4' : '0 0.02 0.1');
        }
        if (this.frontGate) {
          this.frontGate.setAttribute('visible', !extend);
        }
        this.playTone(extend ? 660 : 340, 0.18);
      },

      onTargetVerified: function (id) {
        this.verifiedSet.add(id);
        this.playTone(880, 0.22);
        this.recordLogEntry(`TARGET_VERIFIED_${id}`);
      },

      syncButtons: function () {
        document.querySelectorAll('.stage-btn').forEach((btn, idx) => {
          btn.classList.toggle('active', idx === this.currentStageIndex);
        });
      },

      recordLogEntry: function (eventLabel) {
        this.sessionLog.push({
          timestamp: new Date().toISOString(),
          event: eventLabel,
          elevation_m: Number(this.currentY.toFixed(2)),
          stage_target_m: this.targetY,
          sway_cm_s: Number(this.currentSway.toFixed(2)),
          peak_sway_cm_s: Number(this.peakSway.toFixed(2)),
          targets_verified: this.verifiedSet.size
        });
      },

      exportData: function (format) {
        this.recordLogEntry('MANUAL_EXPORT');
        if (format === 'json') {
          const blob = new Blob([JSON.stringify(this.sessionLog, null, 2)], { type: 'application/json' });
          this.triggerDownload(blob, `vertigo_telemetry_${Date.now()}.json`);
        } else {
          const headers = 'timestamp,event,elevation_m,stage_target_m,sway_cm_s,peak_sway_cm_s,targets_verified\n';
          const rows = this.sessionLog.map(r =>
            `${r.timestamp},${r.event},${r.elevation_m},${r.stage_target_m},${r.sway_cm_s},${r.peak_sway_cm_s},${r.targets_verified}`
          ).join('\n');
          const blob = new Blob([headers + rows], { type: 'text/csv' });
          this.triggerDownload(blob, `vertigo_telemetry_${Date.now()}.csv`);
        }
      },

      triggerDownload: function (blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      },

      tick: function (t, dt) {
        if (!dt) return;
        const dtSec = dt / 1000;

        // 1. Smooth Elevator Interpolation
        const diff = this.targetY - this.currentY;
        if (Math.abs(diff) > 0.01) {
          const step = Math.sign(diff) * Math.min(Math.abs(diff), this.speed * dtSec);
          this.currentY += step;
          if (this.rig) {
            this.rig.object3D.position.y = this.currentY;
          }
        } else {
          this.currentY = this.targetY;
        }

        // 2. Modulate Ambient Wind by Altitude
        if (this.windGain && this.audioCtx) {
          const gainTarget = 0.01 + (this.currentY / 60) * 0.14;
          this.windGain.gain.setTargetAtTime(gainTarget, this.audioCtx.currentTime, 0.1);
        }

        // 3. Head Postural Sway Calculation (cm/s horizontal velocity)
        if (this.cam) {
          const pos = this.cam.object3D.position;
          if (this.hasLastCam && dtSec > 0) {
            const dx = pos.x - this.lastCamPos.x;
            const dz = pos.z - this.lastCamPos.z;
            const distCm = Math.sqrt(dx * dx + dz * dz) * 100;
            const instSway = distCm / dtSec;
            this.currentSway = this.currentSway * 0.85 + instSway * 0.15;
            if (this.currentSway > this.peakSway) {
              this.peakSway = this.currentSway;
            }
          }
          this.lastCamPos.copy(pos);
          this.hasLastCam = true;
        }

        // 4. Periodic Sparkline & Telemetry Update (10Hz UI refresh)
        this.sampleAccum += dt;
        if (this.sampleAccum >= 100) {
          this.sampleAccum = 0;
          this.swayHistory.push(this.currentSway);
          if (this.swayHistory.length > 60) this.swayHistory.shift();
          this.updateHUD();
          this.drawSparkline();
        }
      },

      updateHUD: function () {
        const elVal = document.getElementById('hud-elev');
        const swVal = document.getElementById('hud-sway');
        const pkVal = document.getElementById('hud-peak');
        const tgVal = document.getElementById('hud-targets');
        const badge = document.getElementById('hud-status');

        if (elVal) elVal.textContent = `${this.currentY.toFixed(1)} m`;
        if (swVal) swVal.textContent = `${this.currentSway.toFixed(1)} cm/s`;
        if (pkVal) pkVal.textContent = `${this.peakSway.toFixed(1)} cm/s`;
        if (tgVal) tgVal.textContent = `${this.verifiedSet.size} / 4`;

        let stability = 'STABLE';
        if (this.currentSway > 18) stability = 'HIGH SWAY';
        else if (this.currentSway > 8) stability = 'MODERATE';

        if (badge) {
          badge.textContent = stability;
          badge.style.color = stability === 'STABLE' ? '#22c55e' : (stability === 'MODERATE' ? '#f59e0b' : '#ef4444');
          badge.style.borderColor = badge.style.color;
        }

        if (this.vrReadout) {
          this.vrReadout.setAttribute(
            'value',
            `ALT: ${this.currentY.toFixed(1)}m / ${this.targetY}m\nSWAY: ${this.currentSway.toFixed(1)} cm/s (PK: ${this.peakSway.toFixed(1)})\nTARGETS: ${this.verifiedSet.size}/4 | ${stability}`
          );
        }
      },

      drawSparkline: function () {
        if (!this.swayCtx || !this.swayCanvas) return;
        const ctx = this.swayCtx;
        const w = this.swayCanvas.width;
        const h = this.swayCanvas.height;
        ctx.clearRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const maxScale = 30;
        for (let i = 0; i < this.swayHistory.length; i++) {
          const x = (i / (this.swayHistory.length - 1)) * w;
          const norm = Math.min(this.swayHistory[i] / maxScale, 1);
          const y = h - norm * (h - 6) - 3;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    });

    // Global helper for 2D HUD buttons & Keyboard shortcuts
    window.simCmd = function (action, param) {
      const scene = document.querySelector('a-scene');
      if (scene && scene.components['elevator-telemetry-system']) {
        scene.components['elevator-telemetry-system'].handleAction(action, param);
      }
    };

    window.simExport = function (fmt) {
      const scene = document.querySelector('a-scene');
      if (scene && scene.components['elevator-telemetry-system']) {
        scene.components['elevator-telemetry-system'].exportData(fmt);
      }
    };

    window.addEventListener('keydown', (e) => {
      if (e.key >= '1' && e.key <= '5') {
        window.simCmd('stage', String(parseInt(e.key, 10) - 1));
      } else if (e.key.toLowerCase() === 'p') {
        window.simCmd('toggle-plank');
      } else if (e.key === ' ') {
        window.simCmd('abort');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const skyImg = document.getElementById('skybox-img');
      const envSky = document.getElementById('env-sky');
      if (skyImg && envSky) {
        skyImg.addEventListener('error', () => {
          const mesh = envSky.getObject3D('mesh');
          if (mesh) {
            mesh.material.map = TextureFactory.getFallbackSky();
            mesh.material.needsUpdate = true;
          }
        });
      }
    });
  </script>
</head>
<body>

  <!-- 2D INSTRUCTOR TELEMETRY HUD -->
  <div id="hud">
    <div class="hud-header">
      <div class="hud-title">WAH Vertigo Assessment</div>
      <div id="hud-status" class="badge">STABLE</div>
    </div>

    <div class="telemetry-grid">
      <div class="metric-box">
        <div class="metric-label">Elevation</div>
        <div id="hud-elev" class="metric-val">0.0 m</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Postural Sway</div>
        <div id="hud-sway" class="metric-val">0.0 cm/s</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Peak Sway</div>
        <div id="hud-peak" class="metric-val">0.0 cm/s</div>
      </div>
      <div class="metric-box">
        <div class="metric-label">Targets Verified</div>
        <div id="hud-targets" class="metric-val">0 / 4</div>
      </div>
    </div>

    <canvas id="sway-canvas" width="330" height="44"></canvas>

    <div class="stage-grid">
      <button class="btn stage-btn active" onclick="simCmd('stage', '0')">0m</button>
      <button class="btn stage-btn" onclick="simCmd('stage', '1')">5m</button>
      <button class="btn stage-btn" onclick="simCmd('stage', '2')">15m</button>
      <button class="btn stage-btn" onclick="simCmd('stage', '3')">30m</button>
      <button class="btn stage-btn" onclick="simCmd('stage', '4')">60m</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-warn" onclick="simCmd('toggle-plank')">Toggle 60m Plank (P)</button>
      <button class="btn btn-danger" onclick="simCmd('abort')">Emergency Ground (SPC)</button>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="simExport('csv')">Export CSV</button>
      <button class="btn" onclick="simExport('json')">Export JSON</button>
    </div>

    <div class="instructions">
      <strong>Controls:</strong> Keys [1-5] Stage | [WASD] Walk | Mouse Drag / Gaze to verify orange spheres | [P] Cantilever Plank.
    </div>
  </div>

  <!-- 3D WEBGL / WEBXR SCENE -->
  <a-scene
    elevator-telemetry-system
    renderer="antialias: true; colorManagement: true"
    background="color: #94a3b8"
    fog="type: linear; color: #94a3b8; near: 80; far: 350"
    cursor="rayOrigin: mouse"
    raycaster="objects: .clickable">

    <!-- ASSET PRELOADER FOR ROOT SKYBOX & CITY MODEL -->
    <a-assets timeout="10000">
      <img id="skybox-img" src="./Skybox.jpeg" crossorigin="anonymous">
      <a-asset-item id="city-model" src="./City.glb"></a-asset-item>
    </a-assets>

    <!-- 360 EQUIRECTANGULAR SKYBOX (EXEMPT FROM FOG) -->
    <a-sky
      id="env-sky"
      src="#skybox-img"
      radius="450"
      rotation="0 -90 0"
      material="shader: flat; fog: false">
    </a-sky>

    <!-- LIGHTING -->
    <a-entity light="type: ambient; color: #cbd5e1; intensity: 0.75"></a-entity>
    <a-entity light="type: directional; color: #ffffff; intensity: 0.95" position="25 60 30"></a-entity>

    <!-- GROUND PLANE -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="300"
      height="300"
      procedural-material="type: ground; repeatX: 60; repeatY: 60">
    </a-plane>

    <!-- PROCEDURAL 65M LATTICE TOWER -->
    <a-entity id="lattice-tower" industrial-tower-builder></a-entity>

    <!-- 3D CITY ENVIRONMENT (City.glb positioned around the tower base) -->
    <a-entity gltf-model="#city-model" position="0 0 -25" scale="1 1 1" rotation="0 0 0"></a-entity>

    <!-- GROUND SCALE REFERENCE OBJECTS (SHIPPING CONTAINERS & SAFETY VEHICLE) -->
    <a-box position="-9 1.3 5" width="2.5" height="2.6" depth="6.0" color="#1d4ed8"></a-box>
    <a-box position="-6 1.3 5" width="2.5" height="2.6" depth="6.0" color="#b91c1c"></a-box>
    <a-entity position="7 0 6" rotation="0 -25 0">
      <a-box position="0 1.1 0" width="2.2" height="2.2" depth="5.0" color="#f8fafc"></a-box>
      <a-box position="0 1.2 0.1" width="2.25" height="0.45" depth="4.8" color="#dc2626"></a-box>
      <a-sphere position="-0.6 2.3 1.8" radius="0.15" color="#38bdf8" material="shader: flat"></a-sphere>
      <a-sphere position="0.6 2.3 1.8" radius="0.15" color="#ef4444" material="shader: flat"></a-sphere>
    </a-entity>

    <!-- ELEVATOR PLATFORM RIG -->
    <a-entity id="elevator-rig" position="0 0 0">

      <!-- SEE-THROUGH STEEL GRATING FLOOR -->
      <a-plane
        position="0 0.01 0"
        rotation="-90 0 0"
        width="2.8"
        height="2.6"
        procedural-material="type: grating; repeatX: 6; repeatY: 6">
      </a-plane>

      <!-- PERIMETER TOE-BOARDS -->
      <a-box position="0 0.08 -1.3" width="2.8" height="0.16" depth="0.06" procedural-material="type: hazard; repeatX: 4; repeatY: 1"></a-box>
      <a-box position="-1.4 0.08 0" width="0.06" height="0.16" depth="2.6" procedural-material="type: hazard; repeatX: 4; repeatY: 1"></a-box>
      <a-box position="1.4 0.08 0" width="0.06" height="0.16" depth="2.6" procedural-material="type: hazard; repeatX: 4; repeatY: 1"></a-box>

      <!-- SAFETY HANDRAILS (WEST, EAST, NORTH) -->
      <a-box position="-1.4 1.0 0" width="0.06" height="0.06" depth="2.6" color="#eab308"></a-box>
      <a-box position="1.4 1.0 0" width="0.06" height="0.06" depth="2.6" color="#eab308"></a-box>
      <a-box position="0 1.0 -1.3" width="2.8" height="0.06" depth="0.06" color="#eab308"></a-box>

      <!-- FRONT SAFETY GATE (OPENS WHEN PLANK IS DEPLOYED) -->
      <a-entity id="front-safety-gate" position="0 0 1.3">
        <a-box position="0 1.0 0" width="2.8" height="0.06" depth="0.06" color="#ef4444"></a-box>
        <a-box position="0 0.5 0" width="2.8" height="0.04" depth="0.04" color="#eab308"></a-box>
      </a-entity>

      <!-- RETRACTABLE CANTILEVER EXPOSURE PLANK -->
      <a-box
        id="cantilever-plank"
        position="0 0.02 0.1"
        width="0.48"
        height="0.05"
        depth="3.5"
        procedural-material="type: plank; repeatX: 1; repeatY: 4">
      </a-box>

      <!-- GAZE VERIFICATION TARGET SPHERES AROUND CAGE -->
      <a-sphere class="clickable" gaze-target="id: T1" position="-2.4 1.4 2.4" radius="0.28" color="#f97316"></a-sphere>
      <a-sphere class="clickable" gaze-target="id: T2" position="2.4 1.4 2.4" radius="0.28" color="#f97316"></a-sphere>
      <a-sphere class="clickable" gaze-target="id: T3" position="0 -1.8 3.2" radius="0.32" color="#f97316"></a-sphere>
      <a-sphere class="clickable" gaze-target="id: T4" position="2.6 2.2 -1.2" radius="0.28" color="#f97316"></a-sphere>

      <!-- IN-CABIN 3D SPATIAL CONTROL CONSOLE -->
      <a-entity position="-0.85 1.15 -1.18" rotation="0 12 0">
        <a-box width="1.15" height="0.72" depth="0.05" color="#0f172a"></a-box>
        <a-text
          id="vr-console-readout"
          value="ALT: 0.0m / 0m\nSWAY: 0.0 cm/s\nTARGETS: 0/4 | STABLE"
          position="-0.52 0.21 0.03"
          width="1.9"
          color="#38bdf8">
        </a-text>

        <!-- 3D Stage Buttons -->
        <a-box class="clickable" vr-ui-btn="action: stage; param: 0" position="-0.42 -0.05 0.04" width="0.18" height="0.11" depth="0.03" color="#1e293b">
          <a-text value="0m" align="center" position="0 0 0.02" width="1.8" color="#ffffff"></a-text>
        </a-box>
        <a-box class="clickable" vr-ui-btn="action: stage; param: 1" position="-0.21 -0.05 0.04" width="0.18" height="0.11" depth="0.03" color="#1e293b">
          <a-text value="5m" align="center" position="0 0 0.02" width="1.8" color="#ffffff"></a-text>
        </a-box>
        <a-box class="clickable" vr-ui-btn="action: stage; param: 2" position="0.0 -0.05 0.04" width="0.18" height="0.11" depth="0.03" color="#1e293b">
          <a-text value="15m" align="center" position="0 0 0.02" width="1.8" color="#ffffff"></a-text>
        </a-box>
        <a-box class="clickable" vr-ui-btn="action: stage; param: 3" position="0.21 -0.05 0.04" width="0.18" height="0.11" depth="0.03" color="#1e293b">
          <a-text value="30m" align="center" position="0 0 0.02" width="1.8" color="#ffffff"></a-text>
        </a-box>
        <a-box class="clickable" vr-ui-btn="action: stage; param: 4" position="0.42 -0.05 0.04" width="0.18" height="0.11" depth="0.03" color="#1e293b">
          <a-text value="60m" align="center" position="0 0 0.02" width="1.8" color="#ffffff"></a-text>
        </a-box>

        <!-- Plank & Emergency Descent 3D Buttons -->
        <a-box class="clickable" vr-ui-btn="action: toggle-plank" position="-0.25 -0.22 0.04" width="0.48" height="0.12" depth="0.03" color="#b45309">
          <a-text value="PLANK TOGGLE" align="center" position="0 0 0.02" width="1.6" color="#ffffff"></a-text>
        </a-box>
        <a-box class="clickable" vr-ui-btn="action: abort" position="0.27 -0.22 0.04" width="0.48" height="0.12" depth="0.03" color="#b91c1c">
          <a-text value="ABORT (0m)" align="center" position="0 0 0.02" width="1.6" color="#ffffff"></a-text>
        </a-box>
      </a-entity>

      <!-- PLAYER CAMERA & VR CONTROLLERS -->
      <a-entity id="head-camera" camera look-controls wasd-controls="acceleration: 14" position="0 1.65 0">
        <a-ring
          cursor="fuse: false"
          raycaster="objects: .clickable; far: 25"
          position="0 0 -1"
          radius-inner="0.012"
          radius-outer="0.018"
          color="#38bdf8"
          material="shader: flat">
        </a-ring>
      </a-entity>

      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 25"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 25"></a-entity>

    </a-entity>
  </a-scene>

</body>
</html>
